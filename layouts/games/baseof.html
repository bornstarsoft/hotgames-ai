<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  {{ partial "head.html" . }}
  {{ $styles := partialCached "guide-styles.html" . }}
  <link rel="stylesheet" href="{{ $styles.RelPermalink }}">
</head>
<body class="puzzle-directory">
  <a class="skip-link" href="#main-content">Skip to puzzles</a>
  <header class="guide-header">
    <a class="guide-brand" href="/"><img src="/apple-touch-icon.png" width="28" height="28" alt="">HotGames<span>.ai</span></a>
    <nav aria-label="Site navigation">
      <a href="/">Discover</a>
      <a href="/games/"{{ if .IsSection }} aria-current="page"{{ end }}>Game guides</a>
      <a href="/?view=saved" aria-label="Saved games" title="Saved games"><i class="fa-regular fa-heart" aria-hidden="true"></i></a>
      <button id="guideTheme" type="button" aria-label="Use light theme" title="Change theme"><i class="fa-solid fa-sun" aria-hidden="true"></i></button>
    </nav>
  </header>
  <main id="main-content">
    {{ block "main" . }}{{ end }}
    <footer class="guide-footer">
      <a href="/">Back to all games <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
      <nav aria-label="Footer">{{ range .Site.Params.footer_menu }}<a href="{{ .url }}">{{ .name }}</a>{{ end }}</nav>
    </footer>
  </main>
  <div class="guide-save-status" id="guideSaveToast" hidden>
    <p id="guideSaveStatus" role="status" aria-live="polite" aria-atomic="true"></p>
    <span id="guideSavedDestination" hidden><a class="back-link" href="/?view=saved">Saved games <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a></span>
    <button id="guideSaveUndo" type="button" hidden><i class="fa-solid fa-rotate-left" aria-hidden="true"></i> Undo</button>
    <button id="guideSaveDismiss" type="button" aria-label="Dismiss notification" title="Dismiss notification" hidden><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
  </div>
  <script>
    (() => {
      const button = document.getElementById('guideTheme');
      let temporaryTheme = null;
      function setTheme(theme) {
        const light = theme === 'light';
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        button.setAttribute('aria-label', light ? 'Use dark theme' : 'Use light theme');
        button.querySelector('i').className = light ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
      }
      function syncTheme() {
        if (temporaryTheme !== null) {
          setTheme(temporaryTheme);
          return;
        }
        try { setTheme(localStorage.getItem('theme')); }
        catch (_) { setTheme(document.documentElement.dataset.theme); }
      }
      syncTheme();
      button.addEventListener('click', () => {
        const theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
        setTheme(theme);
        try {
          localStorage.setItem('theme', theme);
          temporaryTheme = null;
        } catch (_) { temporaryTheme = theme; }
      });
      window.addEventListener('storage', (event) => {
        if (event.key !== null && event.key !== 'theme') return;
        try { if (event.storageArea !== localStorage) return; } catch (_) { return; }
        // An explicit preference change or reset supersedes this page's temporary choice.
        temporaryTheme = null;
        syncTheme();
      });
      window.addEventListener('pageshow', event => { if (event.persisted) syncTheme(); });

      {{ $playTargets := dict }}
      {{ range .Site.Params.new_games.list }}
        {{ if .puzzle_type }}{{ $playTargets = merge $playTargets (dict .link .id) }}{{ end }}
      {{ end }}
      const playTargets = {{ $playTargets | jsonify | safeJS }};
      {{ $savedAliases := dict }}
      {{ range .Site.Params.new_games.list }}
        {{ if .puzzle_type }}{{ $savedAliases = merge $savedAliases (dict (.link | urlize) .id) }}{{ end }}
      {{ end }}
      const savedAliases = new Map(Object.entries({{ $savedAliases | jsonify | safeJS }}));
      const saveButtons = document.querySelectorAll('[data-save-game]');
      const saveStatus = document.getElementById('guideSaveStatus');
      const saveToast = document.getElementById('guideSaveToast');
      const saveUndo = document.getElementById('guideSaveUndo');
      const saveDismiss = document.getElementById('guideSaveDismiss');
      const savedDestination = document.getElementById('guideSavedDestination');
      let statusTimer;
      let undoSave;
      let saveOrigin;
      let savedNoticeId;

      function readSaved() {
        try {
          const raw = localStorage.getItem('likedGames');
          let ids;
          try { ids = JSON.parse(raw || '[]'); } catch (_) { ids = []; }
          // Preserve other catalog games while normalizing the guides' legacy IDs.
          return new Set(Array.isArray(ids)
            ? ids.filter(id => typeof id === 'string').map(id => savedAliases.get(id) || id) : []);
        } catch (_) { return null; }
      }

      function syncSaved() {
        const saved = readSaved();
        if (saved && savedNoticeId && !saved.has(savedNoticeId)) dismissSave();
        saveButtons.forEach(control => {
          const active = saved?.has(control.dataset.saveGame) || false;
          const label = `${active ? 'Remove' : 'Save'} ${control.dataset.gameName}`;
          control.setAttribute('aria-pressed', String(active));
          control.setAttribute('aria-label', label);
          control.title = label;
          control.querySelector('i').className = active ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
          control.hidden = false;
        });
      }

      function announceSave(message, undo, savedId) {
        clearTimeout(statusTimer);
        undoSave = undo;
        savedNoticeId = savedId;
        saveUndo.hidden = !undo;
        savedDestination.hidden = !savedId;
        saveDismiss.hidden = !undo && !savedId;
        saveToast.hidden = false;
        saveStatus.textContent = message;
        if (!undo && !savedId) statusTimer = setTimeout(() => { saveToast.hidden = true; }, 4500);
      }

      function dismissSave(restoreFocus = false) {
        clearTimeout(statusTimer);
        undoSave = undefined;
        savedNoticeId = undefined;
        if (restoreFocus || saveToast.contains(document.activeElement)) saveOrigin?.focus({ preventScroll: true });
        saveToast.hidden = true;
      }

      saveUndo.addEventListener('click', () => { if (undoSave) undoSave(); });
      saveDismiss.addEventListener('click', () => dismissSave(true));
      saveToast.addEventListener('keydown', event => {
        if (event.key !== 'Escape') return;
        event.preventDefault();
        dismissSave(true);
      });

      saveButtons.forEach(control => control.addEventListener('click', () => {
        saveOrigin = control;
        // Read again for each action so changes from another page are retained.
        const saved = readSaved();
        if (!saved) {
          announceSave('Saving is unavailable in this browser.');
          return;
        }
        const id = control.dataset.saveGame;
        const removing = saved.has(id);
        if (removing) saved.delete(id);
        else saved.add(id);
        try {
          localStorage.setItem('likedGames', JSON.stringify([...saved]));
        } catch (_) {
          announceSave('Changes could not be saved in this browser.');
          return;
        }
        syncSaved();
        function restoreGame() {
          // Merge into current storage; never restore an outdated whole collection.
          const current = readSaved();
          if (!current) {
            announceSave('Saving is unavailable in this browser.', restoreGame);
            return;
          }
          current.add(id);
          try {
            localStorage.setItem('likedGames', JSON.stringify([...current]));
          } catch (_) {
            announceSave('Changes could not be saved in this browser.', restoreGame);
            return;
          }
          syncSaved();
          control.focus({ preventScroll: true });
          announceSave(`${control.dataset.gameName} restored.`, undefined, id);
        }
        announceSave(`${control.dataset.gameName} ${removing ? 'removed from saved games' : 'saved'}.`, removing ? restoreGame : undefined, removing ? undefined : id);
      }));
      window.addEventListener('storage', event => {
        try { if (event.storageArea !== localStorage) return; } catch (_) { return; }
        if (event.key === null || event.key === 'likedGames') syncSaved();
      });
      window.addEventListener('pageshow', syncSaved);
      syncSaved();

      const guide = document.querySelector('[data-guide-url]');
      if (guide && document.referrer) {
        try {
          const source = new URL(document.referrer);
          // Only the same-origin catalog can supply a return destination.
          if (source.origin === location.origin && source.pathname === '/' && !source.username && !source.password) {
            const target = new URL('/', location.origin);
            for (const key of ['view', 'cat', 'q']) {
              const value = source.searchParams.get(key);
              if (value) target.searchParams.set(key, value);
            }
            const view = target.searchParams.get('view');
            if (!['saved', 'recent'].includes(view)) target.searchParams.delete('view');
            const label = view === 'saved' ? 'Back to saved games'
              : view === 'recent' ? 'Back to recently opened'
                : target.search ? 'Back to game results' : 'Back to all games';
            guide.querySelectorAll('[data-guide-back]').forEach(link => {
              link.href = target.pathname + target.search;
              link.querySelector('[data-guide-back-label]').textContent = label;
              link.querySelector('i').className = 'fa-solid fa-arrow-left';
            });
          }
        } catch (_) {}
      }

      for (const id of ['a-simple-starting-strategy', 'when-you-get-stuck', 'try-a-move-check']) {
        const heading = guide?.querySelector(`h2[id="${id}"]`);
        if (!heading) continue;
        const title = heading.textContent;
        const label = document.createElement('span');
        label.textContent = title;
        const copy = document.createElement('button');
        copy.type = 'button';
        copy.className = 'guide-save';
        copy.dataset.copyTip = id;
        copy.title = `Copy link to ${title}`;
        copy.setAttribute('aria-label', copy.title);
        const icon = document.createElement('i');
        icon.className = 'fa-solid fa-link';
        icon.setAttribute('aria-hidden', 'true');
        copy.appendChild(icon);
        heading.classList.add('game-guide-actions');
        heading.replaceChildren(label, copy);
        const status = document.createElement('p');
        status.id = `tip-status-${id}`;
        status.setAttribute('role', 'status');
        status.setAttribute('aria-live', 'polite');
        status.hidden = true;
        heading.after(status);
        copy.setAttribute('aria-describedby', status.id);
        let copying = false;
        let timer;
        copy.addEventListener('click', async () => {
          if (copying) return;
          copying = true;
          copy.setAttribute('aria-busy', 'true');
          clearTimeout(timer);
          // Use the public canonical URL, never preview hosts, queries or local lists.
          const url = new URL(guide.dataset.guideUrl);
          url.search = '';
          url.hash = id;
          try {
            await navigator.clipboard.writeText(url.href);
            status.textContent = 'Tip link copied.';
            status.hidden = false;
            timer = setTimeout(() => { status.hidden = true; }, 4500);
          } catch (_) {
            const link = document.createElement('a');
            link.href = url.href;
            link.textContent = 'Open tip link';
            status.replaceChildren('Copy unavailable. ', link);
            status.hidden = false;
          } finally {
            copying = false;
            copy.removeAttribute('aria-busy');
          }
        });
      }

      // Keep guide launches in the same browser-local history as homepage launches.
      function rememberOpen(event) {
        if (event.button !== 0 && event.button !== 1) return;
        const link = event.target.closest('a[href]');
        const id = link && playTargets[link.href];
        if (!id) return;
        let recent = [];
        try {
          const stored = JSON.parse(localStorage.getItem('recentGames') || '[]');
          if (Array.isArray(stored)) recent = stored.filter(value => typeof value === 'string' && value !== id);
        } catch (_) {}
        try {
          localStorage.setItem('recentGames', JSON.stringify([id, ...new Set(recent)].slice(0, 6)));
        } catch (_) {}
      }
      document.addEventListener('click', rememberOpen);
      document.addEventListener('auxclick', rememberOpen);
    })();
  </script>
</body>
</html>
