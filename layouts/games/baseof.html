<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  {{ partial "head.html" . }}
  {{ $styles := resources.Get "css/puzzle-guide.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $styles.RelPermalink }}">
</head>
<body class="puzzle-directory">
  <a class="skip-link" href="#main-content">Skip to puzzles</a>
  <header class="guide-header">
    <a class="guide-brand" href="/"><img src="/apple-touch-icon.png" width="28" height="28" alt="">HotGames<span>.ai</span></a>
    <nav aria-label="Site navigation">
      <a href="/">Discover</a>
      <a href="/games/"{{ if .IsSection }} aria-current="page"{{ end }}>Game guides</a>
      <a href="/?view=saved" aria-label="Saved games" title="Saved games"><i class="fa-regular fa-heart" aria-hidden="true"></i></a>
      <button id="guideTheme" type="button" aria-label="Use light theme" title="Change theme"><i class="fa-solid fa-sun" aria-hidden="true"></i></button>
    </nav>
  </header>
  <main id="main-content">
    {{ block "main" . }}{{ end }}
    <footer class="guide-footer">
      <a href="/">Back to all games <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
      <nav aria-label="Footer">{{ range .Site.Params.footer_menu }}<a href="{{ .url }}">{{ .name }}</a>{{ end }}</nav>
    </footer>
  </main>
  <p class="guide-save-status" id="guideSaveStatus" role="status" aria-live="polite" aria-atomic="true"></p>
  <script>
    (() => {
      const button = document.getElementById('guideTheme');
      function setTheme(theme) {
        const light = theme === 'light';
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        button.setAttribute('aria-label', light ? 'Use dark theme' : 'Use light theme');
        button.querySelector('i').className = light ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
      }
      try { setTheme(localStorage.getItem('theme')); } catch (_) { setTheme('dark'); }
      button.addEventListener('click', () => {
        const theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
        setTheme(theme);
        try { localStorage.setItem('theme', theme); } catch (_) {}
      });
      window.addEventListener('storage', (event) => { if (event.key === 'theme') setTheme(event.newValue); });

      {{ $playTargets := dict }}
      {{ range .Site.Params.new_games.list }}
        {{ if .puzzle_type }}{{ $playTargets = merge $playTargets (dict .link .id) }}{{ end }}
      {{ end }}
      const playTargets = {{ $playTargets | jsonify | safeJS }};
      {{ $savedAliases := dict }}
      {{ range .Site.Params.new_games.list }}
        {{ if .puzzle_type }}{{ $savedAliases = merge $savedAliases (dict (.link | urlize) .id) }}{{ end }}
      {{ end }}
      const savedAliases = new Map(Object.entries({{ $savedAliases | jsonify | safeJS }}));
      const saveButtons = document.querySelectorAll('[data-save-game]');
      const saveStatus = document.getElementById('guideSaveStatus');
      let statusTimer;

      function readSaved() {
        try {
          const raw = localStorage.getItem('likedGames');
          let ids;
          try { ids = JSON.parse(raw || '[]'); } catch (_) { ids = []; }
          // Preserve other catalog games while normalizing the guides' legacy IDs.
          return new Set(Array.isArray(ids)
            ? ids.filter(id => typeof id === 'string').map(id => savedAliases.get(id) || id) : []);
        } catch (_) { return null; }
      }

      function syncSaved() {
        const saved = readSaved();
        saveButtons.forEach(control => {
          const active = saved?.has(control.dataset.saveGame) || false;
          const label = `${active ? 'Remove' : 'Save'} ${control.dataset.gameName}`;
          control.setAttribute('aria-pressed', String(active));
          control.setAttribute('aria-label', label);
          control.title = label;
          control.querySelector('i').className = active ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
          control.hidden = false;
        });
      }

      function announceSave(message) {
        clearTimeout(statusTimer);
        saveStatus.textContent = message;
        statusTimer = setTimeout(() => { saveStatus.textContent = ''; }, 4500);
      }

      saveButtons.forEach(control => control.addEventListener('click', () => {
        // Read again for each action so changes from another page are retained.
        const saved = readSaved();
        if (!saved) {
          announceSave('Saving is unavailable in this browser.');
          return;
        }
        const id = control.dataset.saveGame;
        const removing = saved.has(id);
        if (removing) saved.delete(id);
        else saved.add(id);
        try {
          localStorage.setItem('likedGames', JSON.stringify([...saved]));
        } catch (_) {
          announceSave('Changes could not be saved in this browser.');
          return;
        }
        syncSaved();
        announceSave(`${control.dataset.gameName} ${removing ? 'removed from saved games' : 'saved'}.`);
      }));
      window.addEventListener('storage', event => {
        if (event.key === null || event.key === 'likedGames') syncSaved();
      });
      window.addEventListener('pageshow', syncSaved);
      syncSaved();

      // Keep guide launches in the same browser-local history as homepage launches.
      function rememberOpen(event) {
        if (event.button !== 0 && event.button !== 1) return;
        const link = event.target.closest('a[href]');
        const id = link && playTargets[link.href];
        if (!id) return;
        let recent = [];
        try {
          const stored = JSON.parse(localStorage.getItem('recentGames') || '[]');
          if (Array.isArray(stored)) recent = stored.filter(value => typeof value === 'string' && value !== id);
        } catch (_) {}
        try {
          localStorage.setItem('recentGames', JSON.stringify([id, ...new Set(recent)].slice(0, 6)));
        } catch (_) {}
      }
      document.addEventListener('click', rememberOpen);
      document.addEventListener('auxclick', rememberOpen);
    })();
  </script>
</body>
</html>
